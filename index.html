<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DALL·E Mini Image Generator</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      body {
        margin: 0;
        padding: 2rem;
        max-width: 1080px;
        margin-inline: auto;
        line-height: 1.5;
      }

      h1 {
        margin-top: 0;
      }

      form {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      textarea {
        width: 100%;
        min-height: 84px;
        padding: 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #8884;
        font: inherit;
      }

      .row {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: center;
      }

      input[type='url'] {
        flex: 1 1 300px;
        min-width: 250px;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #8884;
        font: inherit;
      }

      button {
        padding: 0.55rem 0.9rem;
        border-radius: 0.5rem;
        border: 1px solid #8884;
        cursor: pointer;
      }

      #status {
        min-height: 1.5rem;
      }

      #gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 0.75rem;
        margin-top: 1rem;
      }

      #gallery img {
        width: 100%;
        border-radius: 0.5rem;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>DALL·E Mini Image Generator</h1>
    <p>Enter a prompt and generate images from a DALL·E Mini backend endpoint.</p>

    <form id="generator-form">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" required placeholder="A watercolor painting of a cat riding a bicycle at sunset"></textarea>

      <div class="row">
        <input id="backend" type="url" value="http://localhost:8000/generate" required />
        <button id="generate" type="submit">Generate</button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="gallery" aria-label="Generated images"></section>

    <script>
      const form = document.getElementById('generator-form');
      const promptEl = document.getElementById('prompt');
      const backendEl = document.getElementById('backend');
      const statusEl = document.getElementById('status');
      const galleryEl = document.getElementById('gallery');
      const generateBtn = document.getElementById('generate');

      function setStatus(message) {
        statusEl.textContent = message;
      }

      function renderImages(images, prompt) {
        galleryEl.innerHTML = '';
        images.forEach((img, index) => {
          const image = document.createElement('img');
          image.src = `data:image/png;base64,${img}`;
          image.alt = `Generated image ${index + 1} for prompt: ${prompt}`;
          galleryEl.appendChild(image);
        });
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const prompt = promptEl.value.trim();
        const backend = backendEl.value.trim();

        if (!prompt) {
          setStatus('Please enter a prompt before generating images.');
          return;
        }

        generateBtn.disabled = true;
        setStatus('Generating images...');
        galleryEl.innerHTML = '';

        try {
          const response = await fetch(backend, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
          });

          if (!response.ok) {
            throw new Error(`Backend returned ${response.status}.`);
          }

          const data = await response.json();
          const images = data.images || [];

          if (!images.length) {
            setStatus('No images were returned by the backend.');
            return;
          }

          renderImages(images, prompt);
          setStatus(`Generated ${images.length} image(s). Model version: ${data.version || 'unknown'}.`);
        } catch (error) {
          setStatus(`Generation failed: ${error.message}`);
        } finally {
          generateBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
